let currentKey="";

function typeLine(text, elemId, totalTime, callback){
    let i=0;
    let elem=document.getElementById(elemId);
    elem.innerHTML="";
    let speed = totalTime / text.length;
    let typer=setInterval(()=>{
        elem.innerHTML += text.charAt(i);
        i++;
        if(i>=text.length){
            clearInterval(typer);
            if(callback) callback();
        }
    },speed);
}

function startProcess(){
    if(keys.length===0){
        document.getElementById("finalMsg").style.display="block";
        return;
    }

    document.getElementById("finalMsg").style.display="none";
    document.getElementById("keyBox").style.display="none";
    document.getElementById("copyBtn").style.display="none";
    document.getElementById("keyValue").innerHTML="";
    
    let btn=document.getElementById("genBtn");
    btn.disabled=true;

    let timeLeft=15;
    btn.innerText="Wait "+timeLeft+"s…";
    let btnTimer=setInterval(()=>{
        timeLeft--;
        btn.innerText="Wait "+timeLeft+"s…";
        if(timeLeft<=0){
            clearInterval(btnTimer);
            btn.innerText="Generate Key";
            btn.disabled=false;
        }
    },1000);

    let codingTime=10;
    let ct=document.getElementById("codeTimer");
    ct.style.display="block";
    ct.innerText="Join Telegram for more updates | Coding: "+codingTime+"s";

    let codingTimer=setInterval(()=>{
        codingTime--;
        ct.innerText="Join Telegram for more updates | Coding: "+codingTime+"s";
        if(codingTime<=0){
            clearInterval(codingTimer);
            ct.style.display="none";
        }
    },1000);

    let codingLine="Connecting to FELX server, encrypting module, verifying session, compiling key...";
    typeLine(codingLine,"codingBox",10000,()=>{
        currentKey=keys.shift();
        document.getElementById("keyValue").innerText=currentKey;
        document.getElementById("keyBox").style.display="block";
        document.getElementById("copyBtn").style.display="inline-block";
    });
}

function copyKey(){
    navigator.clipboard.writeText(currentKey);
    let btn=document.getElementById("copyBtn");
    btn.innerText="COPIED ✓";
    setTimeout(()=>{btn.innerText="COPY KEY";},1500);
}
